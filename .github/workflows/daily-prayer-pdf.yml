name: Daily prayer-request PDF

on:
  push:
    branches:
      - main
  schedule:
    - cron: '30 20 * * *'       # 20:30 UTC = 02:00 IST, every morning (GitHub may start it a few minutes late)
  workflow_dispatch:
    inputs:
      date:
        description: 'IST date to rebuild (YYYY-MM-DD). Any earlier day with prayers and no release is built too.'
        required: false

permissions:
  contents: write                # needed to publish the Release

concurrency:
  group: prayer-pdf
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TZ: Asia/Kolkata
    defaults:
      run:
        working-directory: prayer-pdf-action   # the scripts, fonts and requirements live here
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: prayer-pdf-action/requirements.txt

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Install Chromium and CJK / emoji fonts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-noto-cjk fonts-noto-cjk-extra fonts-noto-color-emoji
          python -m playwright install --with-deps chromium

      # Every finished IST day that has prayers and no prayers-YYYY-MM-DD release
      # is built. A date typed on "Run workflow" is rebuilt even when its release exists.
      - name: Build and publish every day that has no release
        id: build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
          GH_TOKEN: ${{ github.token }}
          MANUAL_DATE: ${{ github.event.inputs.date }}
        run: |
          set -euo pipefail
          mkdir -p output input
          days=()
          while IFS= read -r line; do
            [ -n "$line" ] && days+=("$line")
          done < <(python scripts/list_prayer_days.py)
          if [ -n "${MANUAL_DATE:-}" ]; then
            found=0
            for d in "${days[@]+"${days[@]}"}"; do
              [ "$d" = "$MANUAL_DATE" ] && found=1
            done
            [ "$found" = 0 ] && days+=("$MANUAL_DATE")
          fi
          existing=$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name')
          built=0
          for day in "${days[@]+"${days[@]}"}"; do
            tag="prayers-${day}"
            if [ "$day" != "${MANUAL_DATE:-}" ] && printf '%s\n' "$existing" | grep -qx "$tag"; then
              echo "Release ${tag} already exists"
              continue
            fi
            log=$(python scripts/export_prayers.py --date "$day")
            printf '%s\n' "$log"
            count=$(printf '%s\n' "$log" | sed -n 's/^[0-9-]*: \([0-9][0-9]*\) prayer requests.*/\1/p' | tail -1)
            if [ "${count:-0}" = "0" ]; then
              echo "No prayer requests on ${day}"
              continue
            fi
            python scripts/fetch_avatars.py "input/${day}.json"
            python scripts/build_prayer_pdf.py \
              --json "input/${day}.json" \
              --avatars avatars.json --avatar-dir profile_images \
              --fonts fonts --logo assets/webuddhist_logo.png \
              --out "output/Prayer_Requests_${day}_A3.pdf"
            pdf="output/Prayer_Requests_${day}_A3.pdf"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "$pdf" --clobber
            else
              gh release create "$tag" "$pdf" \
                --title "Prayer requests – ${day}" \
                --notes "Zabtik Drolchok prayer requests for ${day} (IST): ${count} rows exported. A3 PDF attached – print at 100% / Actual size."
            fi
            built=$((built + 1))
          done
          echo "Published ${built} day(s)"
          echo "count=${built}" >> "$GITHUB_OUTPUT"

      - name: Upload as run artifact
        if: steps.build.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: Prayer_Requests
          path: prayer-pdf-action/output/*.pdf
          retention-days: 90
