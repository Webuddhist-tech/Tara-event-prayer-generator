name: Daily prayer-request PDF

on:
  schedule:
    - cron: '30 1 * * *'        # 01:30 UTC = 07:00 IST, every day (GitHub may start it a few minutes late)
  workflow_dispatch:
    inputs:
      date:
        description: 'IST date to build (YYYY-MM-DD). Leave empty for yesterday.'
        required: false

permissions:
  contents: write                # needed to publish the Release

concurrency:
  group: prayer-pdf
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Install Chromium and CJK / emoji fonts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-noto-cjk fonts-noto-cjk-extra fonts-noto-color-emoji
          python -m playwright install --with-deps chromium

      - name: Export prayer requests from the database
        id: export
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/export_prayers.py ${{ github.event.inputs.date && format('--date {0}', github.event.inputs.date) || '' }}

      - name: Stop if there were no prayers
        if: steps.export.outputs.count == '0'
        run: echo "No prayer requests on ${{ steps.export.outputs.date }} - nothing to build."

      - name: Fetch avatars from Auth0
        if: steps.export.outputs.count != '0'
        env:
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
        run: python scripts/fetch_avatars.py "${{ steps.export.outputs.json }}"

      - name: Build the A3 PDF
        if: steps.export.outputs.count != '0'
        run: |
          mkdir -p output
          python scripts/build_prayer_pdf.py \
            --json "${{ steps.export.outputs.json }}" \
            --avatars avatars.json --avatar-dir profile_images \
            --fonts fonts \
            --out "output/Prayer_Requests_${{ steps.export.outputs.date }}_A3.pdf"

      - name: Upload as run artifact
        if: steps.export.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: Prayer_Requests_${{ steps.export.outputs.date }}
          path: output/*.pdf
          retention-days: 90

      - name: Publish as a GitHub Release
        if: steps.export.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          DAY: ${{ steps.export.outputs.date }}
          COUNT: ${{ steps.export.outputs.count }}
        run: |
          PDF="output/Prayer_Requests_${DAY}_A3.pdf"
          TAG="prayers-${DAY}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PDF" --clobber        # re-run for the same day replaces the PDF
          else
            gh release create "$TAG" "$PDF" \
              --title "Prayer requests – ${DAY}" \
              --notes "Zabtik Drolchok prayer requests for ${DAY} (IST): ${COUNT} rows exported. A3 PDF attached – print at 100% / Actual size."
          fi
